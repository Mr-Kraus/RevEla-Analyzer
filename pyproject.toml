[project]
name = "revela-analyzer"
version = "0.1.0"
description = "RevEla Analyzer - Confiabilidade Elétrica"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "sqlalchemy>=2.0.0",
    "psycopg>=3.1.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.98.0" # Adicionado conforme auditoria M6
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"